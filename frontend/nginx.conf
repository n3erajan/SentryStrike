upstream backend {
    server backend:8000;
}

server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;

    # Drop the nginx version banner from error pages and the Server header.
    server_tokens off;

    # SPA assets are content-hashed by Vite; allow long-lived caching.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location ~ ^/(api|oast)/ {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Report generation / analysis endpoints can run longer than nginx's
        # 60s default read timeout; raise it so long requests aren't cut off.
        proxy_connect_timeout 10s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
